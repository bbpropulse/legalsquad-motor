    lifecycle: active
    production_eligible: true
    selection: default
    high_performance_eligible: false
    version: "1.0.0"
    categories: ["demo", "sintetico"]
    positive_triggers: ["conector-mcp", "demo mcp"]
    negative_triggers: ["entrega_producao", "peca_protocolavel", "parecer_final"]
